<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Filist">
  <meta name="description" content="Kişisel Ajanda & Takvim">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Filist — Ajanda</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0a0a0a;
      --bg2: #111111;
      --bg3: #1a1a1a;
      --border: #2a2a2a;
      --gold: #c9a84c;
      --gold2: #e8c87a;
      --gold-dim: rgba(201,168,76,0.15);
      --text: #e8e0d0;
      --text2: #9a9080;
      --text3: #5a5550;
      --red: #c0392b;
      --amber: #e67e22;
      --green: #27ae60;
      --red-dim: rgba(192,57,43,0.2);
      --amber-dim: rgba(230,126,34,0.2);
      --green-dim: rgba(39,174,96,0.2);
      --radius: 12px;
      --header-h: 72px;
      --bottom-h: 64px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%; background: var(--bg); color: var(--text);
      font-family: 'DM Mono', monospace; overflow: hidden;
    }

    /* ─── SCROLLBAR ─────────────────────────── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ─── AUTH SCREEN ───────────────────────── */
    #auth-screen {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100vh;
      background: radial-gradient(ellipse at 50% 40%, rgba(201,168,76,0.08) 0%, transparent 70%);
    }
    .auth-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 64px; font-weight: 300; letter-spacing: 8px;
      color: var(--gold); margin-bottom: 8px;
      text-shadow: 0 0 40px rgba(201,168,76,0.3);
    }
    .auth-tagline {
      font-size: 11px; letter-spacing: 4px; text-transform: uppercase;
      color: var(--text3); margin-bottom: 64px;
    }
    .auth-divider {
      width: 1px; height: 80px;
      background: linear-gradient(to bottom, transparent, var(--gold), transparent);
      margin-bottom: 64px;
    }
    .btn-google {
      display: flex; align-items: center; gap: 14px;
      background: var(--bg3); border: 1px solid var(--border);
      color: var(--text); padding: 16px 32px; border-radius: var(--radius);
      font-family: 'DM Mono', monospace; font-size: 13px;
      letter-spacing: 2px; cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-google:hover { border-color: var(--gold); color: var(--gold); }
    .btn-google svg { width: 18px; height: 18px; flex-shrink: 0; }

    /* ─── MAIN APP ──────────────────────────── */
    #main-app { display: none; flex-direction: column; height: 100vh; }

    /* ─── HEADER ────────────────────────────── */
    header {
      height: var(--header-h); display: flex; align-items: center;
      padding: 0 20px; border-bottom: 1px solid var(--border);
      background: var(--bg); position: relative; flex-shrink: 0;
    }
    .header-left { flex: 1; }
    .app-name {
      font-family: 'Cormorant Garamond', serif; font-size: 28px;
      font-weight: 300; color: var(--gold); letter-spacing: 4px;
    }
    .header-center { flex: 1; text-align: center; }
    #live-clock {
      font-family: 'DM Mono', monospace; font-size: 20px;
      font-weight: 400; letter-spacing: 2px; color: var(--text);
    }
    #live-date-mini {
      font-size: 9px; letter-spacing: 2px; color: var(--text3);
      text-transform: uppercase; margin-top: 2px;
    }
    .header-right { flex: 1; display: flex; justify-content: flex-end; align-items: center; gap: 12px; }
    .avatar {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid var(--gold); object-fit: cover; cursor: pointer;
    }
    .avatar-placeholder {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid var(--gold); background: var(--bg3);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; cursor: pointer; color: var(--gold);
    }

    /* ─── CONTENT AREA ──────────────────────── */
    #content {
      flex: 1; overflow: hidden; display: flex; flex-direction: column;
    }

    /* ─── CALENDAR VIEW ─────────────────────── */
    #calendar-view { display: flex; flex-direction: column; height: 100%; }

    .cal-nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px 12px;
    }
    .cal-month-label {
      font-family: 'Cormorant Garamond', serif; font-size: 24px;
      font-weight: 600; letter-spacing: 2px;
    }
    .cal-year { color: var(--gold); margin-left: 8px; }
    .cal-nav-btn {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid var(--border); background: transparent;
      color: var(--text2); cursor: pointer; display: flex;
      align-items: center; justify-content: center; font-size: 16px;
      transition: all 0.2s;
    }
    .cal-nav-btn:hover { border-color: var(--gold); color: var(--gold); }

    .cal-weekdays {
      display: grid; grid-template-columns: repeat(7, 1fr);
      padding: 0 12px; margin-bottom: 4px;
    }
    .cal-wd {
      text-align: center; font-size: 9px; letter-spacing: 2px;
      color: var(--text3); text-transform: uppercase; padding: 4px 0;
    }

    .cal-grid {
      display: grid; grid-template-columns: repeat(7, 1fr);
      padding: 0 12px; gap: 4px; flex: 1;
      overflow-y: auto;
    }
    .cal-cell {
      aspect-ratio: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      border-radius: 8px; cursor: pointer; position: relative;
      transition: all 0.2s; gap: 2px;
    }
    .cal-cell:hover { background: var(--bg3); }
    .cal-cell.today { background: var(--gold-dim); }
    .cal-cell.today .cal-day-num { color: var(--gold); }
    .cal-cell.selected { background: var(--gold); }
    .cal-cell.selected .cal-day-num { color: var(--bg); font-weight: 500; }
    .cal-cell.other-month .cal-day-num { color: var(--text3); }
    .cal-day-num { font-size: 14px; line-height: 1; }
    .cal-dots {
      display: flex; gap: 2px; align-items: center; min-height: 5px;
    }
    .cal-dot {
      width: 4px; height: 4px; border-radius: 50%;
    }
    .cal-dot.high { background: var(--red); }
    .cal-dot.medium { background: var(--amber); }
    .cal-dot.low { background: var(--green); }
    .cal-cell.selected .cal-dot.high { background: rgba(192,57,43,0.8); }
    .cal-cell.selected .cal-dot.medium { background: rgba(230,126,34,0.8); }
    .cal-cell.selected .cal-dot.low { background: rgba(39,174,96,0.8); }

    /* ─── BOTTOM PANEL (day entries) ─────────── */
    #day-panel {
      background: var(--bg2); border-top: 1px solid var(--border);
      flex-shrink: 0; transition: height 0.4s cubic-bezier(0.4,0,0.2,1);
      overflow: hidden; display: flex; flex-direction: column;
    }
    #day-panel.collapsed { height: 64px; }
    #day-panel.expanded { height: 55vh; }

    .day-panel-handle {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px; cursor: pointer; flex-shrink: 0;
    }
    .day-panel-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px; font-weight: 400; letter-spacing: 1px;
    }
    .day-panel-count {
      font-size: 10px; color: var(--gold); letter-spacing: 2px;
      background: var(--gold-dim); padding: 3px 10px; border-radius: 20px;
    }
    .day-panel-toggle { color: var(--text3); font-size: 18px; transition: transform 0.3s; }
    #day-panel.expanded .day-panel-toggle { transform: rotate(180deg); }

    #entries-list {
      flex: 1; overflow-y: auto; padding: 0 16px 16px;
    }

    .entry-card {
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 16px;
      margin-bottom: 10px; cursor: pointer;
      transition: all 0.2s; display: flex; gap: 12px; align-items: flex-start;
      position: relative; overflow: hidden;
    }
    .entry-card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0;
      width: 3px;
    }
    .entry-card.high::before { background: var(--red); }
    .entry-card.medium::before { background: var(--amber); }
    .entry-card.low::before { background: var(--green); }
    .entry-card:hover { border-color: var(--gold-dim); transform: translateX(2px); }

    .entry-thumb {
      width: 52px; height: 52px; border-radius: 8px;
      object-fit: cover; flex-shrink: 0; border: 1px solid var(--border);
    }
    .entry-body { flex: 1; min-width: 0; }
    .entry-title {
      font-family: 'Cormorant Garamond', serif; font-size: 17px;
      font-weight: 600; margin-bottom: 4px; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .entry-notes {
      font-size: 11px; color: var(--text2); line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .entry-meta {
      display: flex; align-items: center; gap: 8px; margin-top: 6px;
    }
    .entry-time { font-size: 10px; color: var(--text3); letter-spacing: 1px; }
    .priority-badge {
      font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
      padding: 2px 8px; border-radius: 10px;
    }
    .priority-badge.high { background: var(--red-dim); color: var(--red); }
    .priority-badge.medium { background: var(--amber-dim); color: var(--amber); }
    .priority-badge.low { background: var(--green-dim); color: var(--green); }

    .empty-day {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 40px 20px; color: var(--text3);
    }
    .empty-day-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.5; }
    .empty-day-text { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }

    /* ─── FAB ───────────────────────────────── */
    #fab {
      position: fixed; right: 20px; bottom: 90px;
      width: 56px; height: 56px; border-radius: 28px;
      background: var(--gold); color: var(--bg); border: none;
      font-size: 24px; cursor: pointer; box-shadow: 0 4px 20px rgba(201,168,76,0.4);
      transition: all 0.3s; display: flex; align-items: center; justify-content: center;
      z-index: 100; font-weight: 300;
    }
    #fab:hover { transform: scale(1.1); box-shadow: 0 6px 30px rgba(201,168,76,0.6); }
    #fab:active { transform: scale(0.95); }

    /* ─── MODAL ─────────────────────────────── */
    #modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.8); z-index: 200;
      align-items: flex-end; justify-content: center;
      backdrop-filter: blur(4px);
    }
    #modal-overlay.open { display: flex; }
    #modal {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 20px 20px 0 0; width: 100%; max-width: 600px;
      max-height: 90vh; overflow-y: auto; padding: 24px 20px 40px;
      animation: slideUp 0.3s cubic-bezier(0.4,0,0.2,1);
    }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal-handle {
      width: 40px; height: 4px; background: var(--border);
      border-radius: 2px; margin: 0 auto 24px;
    }
    .modal-title {
      font-family: 'Cormorant Garamond', serif; font-size: 22px;
      font-weight: 600; margin-bottom: 20px; letter-spacing: 1px;
    }
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block; font-size: 9px; letter-spacing: 3px;
      text-transform: uppercase; color: var(--text3); margin-bottom: 8px;
    }
    .form-input, .form-textarea, .form-select {
      width: 100%; background: var(--bg3); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px 14px; color: var(--text);
      font-family: 'DM Mono', monospace; font-size: 13px;
      outline: none; transition: border-color 0.2s; -webkit-appearance: none;
    }
    .form-input:focus, .form-textarea:focus, .form-select:focus {
      border-color: var(--gold);
    }
    .form-textarea { resize: none; height: 80px; line-height: 1.6; }
    .form-select option { background: var(--bg3); }

    .priority-btns {
      display: flex; gap: 8px;
    }
    .priority-btn {
      flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
      background: transparent; color: var(--text2); font-family: 'DM Mono', monospace;
      font-size: 10px; letter-spacing: 2px; cursor: pointer; transition: all 0.2s;
      text-transform: uppercase;
    }
    .priority-btn[data-p="high"].active { background: var(--red-dim); border-color: var(--red); color: var(--red); }
    .priority-btn[data-p="medium"].active { background: var(--amber-dim); border-color: var(--amber); color: var(--amber); }
    .priority-btn[data-p="low"].active { background: var(--green-dim); border-color: var(--green); color: var(--green); }

    /* ─── IMAGE UPLOAD ──────────────────────── */
    .img-upload-zone {
      border: 1px dashed var(--border); border-radius: 8px;
      padding: 20px; text-align: center; cursor: pointer;
      transition: all 0.2s; position: relative; overflow: hidden;
    }
    .img-upload-zone:hover { border-color: var(--gold); }
    .img-upload-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
    }
    .img-upload-text { font-size: 11px; color: var(--text3); letter-spacing: 1px; }
    .img-preview-wrap { position: relative; display: inline-block; }
    .img-preview {
      width: 100%; height: 140px; object-fit: cover;
      border-radius: 8px; display: none;
    }
    .img-remove {
      position: absolute; top: 6px; right: 6px; width: 24px; height: 24px;
      border-radius: 12px; background: rgba(0,0,0,0.7); border: none;
      color: white; cursor: pointer; display: none; align-items: center;
      justify-content: center; font-size: 14px;
    }

    .form-row { display: flex; gap: 12px; }
    .form-row .form-group { flex: 1; }

    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .btn-save {
      flex: 1; background: var(--gold); color: var(--bg);
      border: none; border-radius: 8px; padding: 14px;
      font-family: 'DM Mono', monospace; font-size: 12px;
      letter-spacing: 2px; text-transform: uppercase; cursor: pointer;
      transition: all 0.2s;
    }
    .btn-save:hover { background: var(--gold2); }
    .btn-cancel {
      background: transparent; border: 1px solid var(--border);
      color: var(--text2); border-radius: 8px; padding: 14px 20px;
      font-family: 'DM Mono', monospace; font-size: 12px;
      letter-spacing: 2px; cursor: pointer; transition: all 0.2s;
    }
    .btn-cancel:hover { border-color: var(--text2); color: var(--text); }
    .btn-delete {
      background: transparent; border: 1px solid var(--red);
      color: var(--red); border-radius: 8px; padding: 14px 16px;
      font-family: 'DM Mono', monospace; font-size: 12px; cursor: pointer;
      transition: all 0.2s;
    }

    /* ─── TOAST ─────────────────────────────── */
    #toast {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--bg3); border: 1px solid var(--border);
      color: var(--text); font-size: 12px; letter-spacing: 1px;
      padding: 10px 20px; border-radius: 20px; opacity: 0;
      transition: all 0.3s; z-index: 300; white-space: nowrap;
      pointer-events: none;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ─── LOADING ───────────────────────────── */
    #loading-screen {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 999; transition: opacity 0.5s;
    }
    .loading-logo {
      font-family: 'Cormorant Garamond', serif; font-size: 48px;
      font-weight: 300; color: var(--gold); letter-spacing: 8px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.5; } 50% { opacity: 1; }
    }

    /* ─── OFFLINE BADGE ─────────────────────── */
    #offline-badge {
      display: none; position: fixed; top: 76px; left: 50%;
      transform: translateX(-50%);
      background: var(--amber-dim); border: 1px solid var(--amber);
      color: var(--amber); font-size: 10px; letter-spacing: 2px;
      padding: 4px 14px; border-radius: 12px; z-index: 50;
    }
    #offline-badge.show { display: block; }

    /* ─── MONTH STRIP ───────────────────────── */
    .today-strip {
      display: flex; align-items: baseline; gap: 12px;
      padding: 0 20px 10px;
    }
    .today-big {
      font-family: 'Cormorant Garamond', serif;
      font-size: 52px; font-weight: 300; line-height: 1;
      color: var(--gold);
    }
    .today-info { display: flex; flex-direction: column; }
    .today-day-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px; color: var(--text); font-style: italic;
    }
    .today-month-year {
      font-size: 10px; letter-spacing: 3px; color: var(--text3);
      text-transform: uppercase;
    }
  </style>
</head>
<body>

<div id="loading-screen">
  <div class="loading-logo">FİLİST</div>
</div>

<div id="offline-badge">◉ ÇEVRİMDIŞI</div>

<!-- ─── AUTH ───────────────────────────────────── -->
<div id="auth-screen" style="display:none;">
  <div class="auth-logo">FİLİST</div>
  <div class="auth-tagline">Kişisel Ajanda</div>
  <div class="auth-divider"></div>
  <button class="btn-google" id="btn-google-login">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
    </svg>
    Google ile Giriş Yap
  </button>
</div>

<!-- ─── MAIN APP ────────────────────────────────── -->
<div id="main-app">
  <header>
    <div class="header-left">
      <div class="app-name">Filist</div>
    </div>
    <div class="header-center">
      <div id="live-clock">00:00:00</div>
      <div id="live-date-mini">Yükleniyor...</div>
    </div>
    <div class="header-right">
      <div class="avatar-placeholder" id="user-avatar" title="Çıkış için tıkla">?</div>
    </div>
  </header>

  <div id="content">
    <div id="calendar-view">
      <!-- Today strip -->
      <div class="today-strip">
        <div class="today-big" id="today-num">--</div>
        <div class="today-info">
          <div class="today-day-name" id="today-dname">--</div>
          <div class="today-month-year" id="today-my">-- ----</div>
        </div>
      </div>

      <!-- Month nav -->
      <div class="cal-nav">
        <button class="cal-nav-btn" id="prev-month">‹</button>
        <div class="cal-month-label">
          <span id="cal-month-name">--</span>
          <span class="cal-year" id="cal-year">----</span>
        </div>
        <button class="cal-nav-btn" id="next-month">›</button>
      </div>

      <!-- Weekdays -->
      <div class="cal-weekdays">
        <div class="cal-wd">Pt</div>
        <div class="cal-wd">Sa</div>
        <div class="cal-wd">Ça</div>
        <div class="cal-wd">Pe</div>
        <div class="cal-wd">Cu</div>
        <div class="cal-wd">Ct</div>
        <div class="cal-wd">Pz</div>
      </div>

      <!-- Grid -->
      <div class="cal-grid" id="cal-grid"></div>

      <!-- Day panel -->
      <div id="day-panel" class="collapsed">
        <div class="day-panel-handle" id="day-panel-handle">
          <div>
            <div class="day-panel-title" id="day-panel-title">Gün Seç</div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;">
            <span class="day-panel-count" id="day-panel-count" style="display:none;">0</span>
            <span class="day-panel-toggle">⌄</span>
          </div>
        </div>
        <div id="entries-list"></div>
      </div>
    </div>
  </div>
</div>

<!-- ─── FAB ─────────────────────────────────────── -->
<button id="fab" style="display:none;">+</button>

<!-- ─── MODAL ───────────────────────────────────── -->
<div id="modal-overlay">
  <div id="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title">Yeni Kayıt</div>

    <div class="form-group">
      <label class="form-label">Başlık</label>
      <input type="text" class="form-input" id="f-title" placeholder="Kayıt başlığı...">
    </div>

    <div class="form-group">
      <label class="form-label">Not</label>
      <textarea class="form-textarea" id="f-notes" placeholder="Detaylar..."></textarea>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Tarih</label>
        <input type="date" class="form-input" id="f-date">
      </div>
      <div class="form-group">
        <label class="form-label">Saat</label>
        <input type="time" class="form-input" id="f-time">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Öncelik</label>
      <div class="priority-btns">
        <button class="priority-btn" data-p="high">Yüksek</button>
        <button class="priority-btn active" data-p="medium">Orta</button>
        <button class="priority-btn" data-p="low">Düşük</button>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Resim</label>
      <div class="img-upload-zone" id="img-zone">
        <input type="file" id="f-image" accept="image/*">
        <div class="img-preview-wrap">
          <img id="img-preview" class="img-preview" alt="">
          <button class="img-remove" id="img-remove">✕</button>
        </div>
        <div class="img-upload-text" id="img-upload-text">
          📷 Resim seç veya çek
        </div>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" id="btn-cancel">İptal</button>
      <button class="btn-delete" id="btn-delete" style="display:none;">Sil</button>
      <button class="btn-save" id="btn-save">Kaydet</button>
    </div>
  </div>
</div>

<!-- ─── TOAST ───────────────────────────────────── -->
<div id="toast"></div>

<!-- ─── FIREBASE ─────────────────────────────────── -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

<script>
// ─── FIREBASE INIT ──────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyDgF7iMi183LI1RkHnT0ZyAJAx_8ME4oLY",
  authDomain: "filist-83f78.firebaseapp.com",
  projectId: "filist-83f78",
  storageBucket: "filist-83f78.firebasestorage.app",
  messagingSenderId: "718317516714",
  appId: "1:718317516714:web:4dc1b822230538066cddd3",
  measurementId: "G-F6TPW07LY4"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();
const provider = new firebase.auth.GoogleAuthProvider();

// ─── STATE ─────────────────────────────────────────────
let currentUser = null;
let currentDate = new Date();
let selectedDate = null;
let viewYear = currentDate.getFullYear();
let viewMonth = currentDate.getMonth();
let entries = {}; // keyed by 'YYYY-MM-DD', array of entries
let editingEntry = null;
let selectedPriority = 'medium';
let imageFile = null;
let imageUrl = null;
let existingImageUrl = null;

const TR_MONTHS = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran',
  'Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const TR_DAYS = ['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
const TR_DAYS_SHORT = ['Pt','Sa','Ça','Pe','Cu','Ct','Pz'];

// ─── CLOCK ─────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('live-clock').textContent = `${h}:${m}:${s}`;
  
  const dayIdx = (now.getDay() + 6) % 7;
  document.getElementById('live-date-mini').textContent =
    `${TR_DAYS_SHORT[dayIdx]} ${now.getDate()} ${TR_MONTHS[now.getMonth()]}`;

  document.getElementById('today-num').textContent = String(currentDate.getDate()).padStart(2,'0');
  const todayDayIdx = (currentDate.getDay() + 6) % 7;
  document.getElementById('today-dname').textContent = TR_DAYS[todayDayIdx];
  document.getElementById('today-my').textContent =
    `${TR_MONTHS[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
}
setInterval(updateClock, 1000);
updateClock();

// ─── AUTH ───────────────────────────────────────────────
auth.onAuthStateChanged(user => {
  document.getElementById('loading-screen').style.opacity = '0';
  setTimeout(() => document.getElementById('loading-screen').style.display = 'none', 500);

  if (user) {
    currentUser = user;
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('main-app').style.display = 'flex';
    document.getElementById('fab').style.display = 'flex';
    
    // Avatar
    const av = document.getElementById('user-avatar');
    if (user.photoURL) {
      av.outerHTML = `<img class="avatar" id="user-avatar" src="${user.photoURL}" alt="${user.displayName}" title="Çıkış için tıkla">`;
      document.getElementById('user-avatar').addEventListener('click', signOut);
    } else {
      av.textContent = user.displayName ? user.displayName[0].toUpperCase() : '?';
      av.addEventListener('click', signOut);
    }

    // Select today
    selectedDate = formatDate(currentDate);
    loadEntries();
  } else {
    currentUser = null;
    document.getElementById('auth-screen').style.display = 'flex';
    document.getElementById('main-app').style.display = 'none';
    document.getElementById('fab').style.display = 'none';
  }
});

document.getElementById('btn-google-login').addEventListener('click', () => {
  auth.signInWithPopup(provider).catch(err => {
    showToast('Giriş hatası: ' + err.message);
  });
});

function signOut() {
  if (confirm('Çıkış yapmak istiyor musunuz?')) {
    auth.signOut();
  }
}

// ─── DATE HELPERS ───────────────────────────────────────
function formatDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function parseDate(str) {
  const [y,m,d] = str.split('-').map(Number);
  return new Date(y, m-1, d);
}
function isSameDay(d1, d2) {
  return d1.getFullYear()===d2.getFullYear() &&
    d1.getMonth()===d2.getMonth() && d1.getDate()===d2.getDate();
}

// ─── FIRESTORE ──────────────────────────────────────────
function loadEntries() {
  if (!currentUser) return;
  db.collection('users').doc(currentUser.uid).collection('entries')
    .onSnapshot(snap => {
      entries = {};
      snap.forEach(doc => {
        const data = { id: doc.id, ...doc.data() };
        if (!entries[data.date]) entries[data.date] = [];
        entries[data.date].push(data);
      });
      // Sort each day
      Object.keys(entries).forEach(d => {
        entries[d].sort((a,b) => {
          const po = {high:0,medium:1,low:2};
          return po[a.priority||'medium'] - po[b.priority||'medium'];
        });
      });
      renderCalendar();
      if (selectedDate) renderDayPanel(selectedDate);
    }, err => {
      if (err.code === 'unavailable') {
        document.getElementById('offline-badge').classList.add('show');
      }
    });
}

async function saveEntry(data) {
  if (!currentUser) return;
  const ref = db.collection('users').doc(currentUser.uid).collection('entries');
  if (editingEntry) {
    await ref.doc(editingEntry.id).update(data);
    showToast('Kayıt güncellendi');
  } else {
    await ref.add({ ...data, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    showToast('Kayıt eklendi');
  }
}

async function deleteEntry(id) {
  if (!currentUser) return;
  if (!confirm('Bu kaydı silmek istediğinizden emin misiniz?')) return;
  await db.collection('users').doc(currentUser.uid).collection('entries').doc(id).delete();
  showToast('Kayıt silindi');
  closeModal();
}

// ─── CALENDAR RENDER ────────────────────────────────────
document.getElementById('prev-month').addEventListener('click', () => {
  viewMonth--;
  if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  renderCalendar();
});
document.getElementById('next-month').addEventListener('click', () => {
  viewMonth++;
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  renderCalendar();
});

function renderCalendar() {
  document.getElementById('cal-month-name').textContent = TR_MONTHS[viewMonth];
  document.getElementById('cal-year').textContent = viewYear;

  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';

  // First day of month (Mon=0)
  const firstDay = new Date(viewYear, viewMonth, 1);
  let startDow = (firstDay.getDay() + 6) % 7; // Mon=0
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const prevDays = new Date(viewYear, viewMonth, 0).getDate();

  const todayStr = formatDate(currentDate);

  let cells = [];
  // Prev month filler
  for (let i = startDow - 1; i >= 0; i--) {
    cells.push({ day: prevDays - i, month: viewMonth - 1, year: viewYear, other: true });
  }
  // Current month
  for (let d = 1; d <= daysInMonth; d++) {
    cells.push({ day: d, month: viewMonth, year: viewYear, other: false });
  }
  // Next month filler
  const remaining = 42 - cells.length;
  for (let d = 1; d <= remaining; d++) {
    cells.push({ day: d, month: viewMonth + 1, year: viewYear, other: true });
  }

  cells.forEach(c => {
    const realYear = c.month < 0 ? c.year - 1 : (c.month > 11 ? c.year + 1 : c.year);
    const realMonth = ((c.month % 12) + 12) % 12;
    const dateStr = `${realYear}-${String(realMonth+1).padStart(2,'0')}-${String(c.day).padStart(2,'0')}`;

    const cell = document.createElement('div');
    cell.className = 'cal-cell';
    if (c.other) cell.classList.add('other-month');
    if (dateStr === todayStr) cell.classList.add('today');
    if (dateStr === selectedDate) cell.classList.add('selected');

    const num = document.createElement('div');
    num.className = 'cal-day-num';
    num.textContent = c.day;
    cell.appendChild(num);

    // Dots
    const dayEntries = entries[dateStr] || [];
    if (dayEntries.length > 0) {
      const dots = document.createElement('div');
      dots.className = 'cal-dots';
      const shown = dayEntries.slice(0, 3);
      shown.forEach(e => {
        const dot = document.createElement('div');
        dot.className = `cal-dot ${e.priority || 'medium'}`;
        dots.appendChild(dot);
      });
      cell.appendChild(dots);
    }

    cell.addEventListener('click', () => selectDate(dateStr));
    grid.appendChild(cell);
  });
}

function selectDate(dateStr) {
  selectedDate = dateStr;
  renderCalendar();
  renderDayPanel(dateStr);
  const panel = document.getElementById('day-panel');
  panel.classList.remove('collapsed');
  panel.classList.add('expanded');
}

// ─── DAY PANEL ──────────────────────────────────────────
document.getElementById('day-panel-handle').addEventListener('click', () => {
  const panel = document.getElementById('day-panel');
  panel.classList.toggle('collapsed');
  panel.classList.toggle('expanded');
});

function renderDayPanel(dateStr) {
  const d = parseDate(dateStr);
  const dayIdx = (d.getDay() + 6) % 7;
  const todayStr = formatDate(currentDate);
  const label = dateStr === todayStr ? 'Bugün' : `${TR_DAYS[dayIdx]}, ${d.getDate()} ${TR_MONTHS[d.getMonth()]}`;
  document.getElementById('day-panel-title').textContent = label;

  const dayEntries = entries[dateStr] || [];
  const countEl = document.getElementById('day-panel-count');
  if (dayEntries.length > 0) {
    countEl.textContent = dayEntries.length + ' kayıt';
    countEl.style.display = 'inline';
  } else {
    countEl.style.display = 'none';
  }

  const list = document.getElementById('entries-list');
  list.innerHTML = '';

  if (dayEntries.length === 0) {
    list.innerHTML = `<div class="empty-day">
      <div class="empty-day-icon">📋</div>
      <div class="empty-day-text">Bu gün için kayıt yok</div>
    </div>`;
    return;
  }

  dayEntries.forEach(e => {
    const card = document.createElement('div');
    card.className = `entry-card ${e.priority || 'medium'}`;

    let imgHtml = '';
    if (e.imageUrl) {
      imgHtml = `<img class="entry-thumb" src="${e.imageUrl}" alt="" loading="lazy">`;
    }

    card.innerHTML = `
      ${imgHtml}
      <div class="entry-body">
        <div class="entry-title">${escHtml(e.title || 'Başlıksız')}</div>
        ${e.notes ? `<div class="entry-notes">${escHtml(e.notes)}</div>` : ''}
        <div class="entry-meta">
          ${e.time ? `<span class="entry-time">${e.time}</span>` : ''}
          <span class="priority-badge ${e.priority || 'medium'}">${priorityLabel(e.priority)}</span>
        </div>
      </div>
    `;
    card.addEventListener('click', () => openEditModal(e));
    list.appendChild(card);
  });
}

function priorityLabel(p) {
  return p === 'high' ? 'Yüksek' : p === 'low' ? 'Düşük' : 'Orta';
}
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ─── MODAL ──────────────────────────────────────────────
document.getElementById('fab').addEventListener('click', () => openAddModal());
document.getElementById('btn-cancel').addEventListener('click', closeModal);
document.getElementById('btn-save').addEventListener('click', handleSave);
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});
document.getElementById('btn-delete').addEventListener('click', () => {
  if (editingEntry) deleteEntry(editingEntry.id);
});

// Priority buttons
document.querySelectorAll('.priority-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    selectedPriority = btn.dataset.p;
    document.querySelectorAll('.priority-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

// Image
document.getElementById('f-image').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  imageFile = file;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = document.getElementById('img-preview');
    img.src = ev.target.result;
    img.style.display = 'block';
    document.getElementById('img-remove').style.display = 'flex';
    document.getElementById('img-upload-text').style.display = 'none';
  };
  reader.readAsDataURL(file);
});

document.getElementById('img-remove').addEventListener('click', e => {
  e.stopPropagation();
  imageFile = null;
  imageUrl = null;
  existingImageUrl = null;
  document.getElementById('img-preview').style.display = 'none';
  document.getElementById('img-remove').style.display = 'none';
  document.getElementById('img-upload-text').style.display = 'block';
  document.getElementById('f-image').value = '';
});

function openAddModal() {
  editingEntry = null;
  imageFile = null; imageUrl = null; existingImageUrl = null;
  document.getElementById('modal-title').textContent = 'Yeni Kayıt';
  document.getElementById('f-title').value = '';
  document.getElementById('f-notes').value = '';
  document.getElementById('f-date').value = selectedDate || formatDate(currentDate);
  const now = new Date();
  document.getElementById('f-time').value = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  selectedPriority = 'medium';
  document.querySelectorAll('.priority-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.p === 'medium');
  });
  document.getElementById('img-preview').style.display = 'none';
  document.getElementById('img-remove').style.display = 'none';
  document.getElementById('img-upload-text').style.display = 'block';
  document.getElementById('f-image').value = '';
  document.getElementById('btn-delete').style.display = 'none';
  document.getElementById('modal-overlay').classList.add('open');
}

function openEditModal(entry) {
  editingEntry = entry;
  imageFile = null; imageUrl = null;
  existingImageUrl = entry.imageUrl || null;
  document.getElementById('modal-title').textContent = 'Kaydı Düzenle';
  document.getElementById('f-title').value = entry.title || '';
  document.getElementById('f-notes').value = entry.notes || '';
  document.getElementById('f-date').value = entry.date || '';
  document.getElementById('f-time').value = entry.time || '';
  selectedPriority = entry.priority || 'medium';
  document.querySelectorAll('.priority-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.p === selectedPriority);
  });
  if (entry.imageUrl) {
    document.getElementById('img-preview').src = entry.imageUrl;
    document.getElementById('img-preview').style.display = 'block';
    document.getElementById('img-remove').style.display = 'flex';
    document.getElementById('img-upload-text').style.display = 'none';
  } else {
    document.getElementById('img-preview').style.display = 'none';
    document.getElementById('img-remove').style.display = 'none';
    document.getElementById('img-upload-text').style.display = 'block';
  }
  document.getElementById('f-image').value = '';
  document.getElementById('btn-delete').style.display = 'inline-block';
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  editingEntry = null;
}

async function handleSave() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { showToast('Başlık boş olamaz'); return; }

  const btn = document.getElementById('btn-save');
  btn.textContent = 'Kaydediliyor...';
  btn.disabled = true;

  let finalImageUrl = existingImageUrl;

  // Upload image if new file selected
  if (imageFile && currentUser) {
    try {
      const imgRef = storage.ref(`users/${currentUser.uid}/images/${Date.now()}_${imageFile.name}`);
      await imgRef.put(imageFile);
      finalImageUrl = await imgRef.getDownloadURL();
    } catch (err) {
      console.error('Image upload error:', err);
      showToast('Resim yüklenemedi, kayıt yine de kaydedildi');
      finalImageUrl = null;
    }
  }

  // If image was removed
  if (!imageFile && !existingImageUrl) finalImageUrl = null;

  const data = {
    title,
    notes: document.getElementById('f-notes').value.trim(),
    date: document.getElementById('f-date').value,
    time: document.getElementById('f-time').value,
    priority: selectedPriority,
    imageUrl: finalImageUrl || null,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };

  try {
    await saveEntry(data);
    closeModal();
    // Navigate to that date
    if (data.date) {
      const d = parseDate(data.date);
      viewYear = d.getFullYear();
      viewMonth = d.getMonth();
      selectedDate = data.date;
      renderDayPanel(data.date);
      const panel = document.getElementById('day-panel');
      panel.classList.remove('collapsed');
      panel.classList.add('expanded');
    }
  } catch (err) {
    showToast('Hata: ' + err.message);
  } finally {
    btn.textContent = 'Kaydet';
    btn.disabled = false;
  }
}

// ─── TOAST ──────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ─── OFFLINE ────────────────────────────────────────────
window.addEventListener('online', () => document.getElementById('offline-badge').classList.remove('show'));
window.addEventListener('offline', () => document.getElementById('offline-badge').classList.add('show'));
if (!navigator.onLine) document.getElementById('offline-badge').classList.add('show');

// ─── SERVICE WORKER ─────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { scope: './' })
      .then(reg => {
        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              showToast('Güncelleme mevcut — sayfayı yenileyin');
            }
          });
        });
      })
      .catch(err => console.log('SW registration failed:', err));
  });
}

// Init calendar
renderCalendar();
</script>
</body>
