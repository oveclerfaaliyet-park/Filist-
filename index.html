<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Filist">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Filist — Ajanda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a;--bg2:#111;--bg3:#1a1a1a;--border:#2a2a2a;
  --gold:#c9a84c;--gold2:#e8c87a;--gdim:rgba(201,168,76,0.15);
  --text:#e8e0d0;--t2:#9a9080;--t3:#5a5550;
  --red:#c0392b;--amb:#e67e22;--grn:#27ae60;
  --rdim:rgba(192,57,43,0.2);--adim:rgba(230,126,34,0.2);--grdim:rgba(39,174,96,0.2);
  --r:12px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;overflow:hidden}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* LOADING */
#LS{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;transition:opacity .5s}
.ll{font-family:'Cormorant Garamond',serif;font-size:48px;font-weight:300;color:var(--gold);letter-spacing:8px;animation:pu 2s ease-in-out infinite}
.ls" id="lsub"{font-size:10px;letter-spacing:3px;color:var(--t3);margin-top:14px;text-transform:uppercase;min-height:16px}
@keyframes pu{0%,100%{opacity:.3}50%{opacity:1}}

/* AUTH */
#AS{display:none;flex-direction:column;align-items:center;justify-content:center;height:100vh;
    background:radial-gradient(ellipse at 50% 40%,rgba(201,168,76,.07) 0%,transparent 70%)}
.al{font-family:'Cormorant Garamond',serif;font-size:60px;font-weight:300;letter-spacing:8px;color:var(--gold);margin-bottom:8px}
.at{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--t3);margin-bottom:52px}
.ad{width:1px;height:64px;background:linear-gradient(to bottom,transparent,var(--gold),transparent);margin-bottom:52px}
.bg{display:flex;align-items:center;gap:12px;background:var(--bg3);border:1px solid var(--gold);
    color:var(--gold);padding:15px 28px;border-radius:var(--r);font-family:'DM Mono',monospace;
    font-size:13px;letter-spacing:2px;cursor:pointer;transition:all .2s;width:260px;justify-content:center}
.bg:active{transform:scale(.97);background:var(--gdim)}
.bg svg{width:18px;height:18px;flex-shrink:0}
.bg:disabled{opacity:.5;cursor:not-allowed}
#aerr{margin-top:16px;font-size:11px;color:var(--red);letter-spacing:1px;text-align:center;
      max-width:280px;line-height:1.7;min-height:20px;padding:0 10px}
#astatus{margin-top:10px;font-size:10px;color:var(--t3);letter-spacing:1px;text-align:center;min-height:16px}

/* MAIN */
#MA{display:none;flex-direction:column;height:100vh}

/* HEADER */
header{height:66px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.an{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:300;color:var(--gold);letter-spacing:4px;flex:1}
#clk{font-family:'DM Mono',monospace;font-size:18px;letter-spacing:2px;text-align:center;flex:1}
#cld{font-size:9px;letter-spacing:2px;color:var(--t3);text-transform:uppercase;text-align:center}
.hr{flex:1;display:flex;justify-content:flex-end}
.av{width:32px;height:32px;border-radius:50%;border:1px solid var(--gold);background:var(--bg3);
    display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;color:var(--gold)}
img.av{object-fit:cover}

/* CONTENT */
#CV{display:flex;flex-direction:column;flex:1;overflow:hidden}

/* TODAY */
.ts{display:flex;align-items:baseline;gap:10px;padding:10px 16px 4px}
.tb{font-family:'Cormorant Garamond',serif;font-size:44px;font-weight:300;line-height:1;color:var(--gold)}
.tn{font-family:'Cormorant Garamond',serif;font-size:17px;font-style:italic}
.tm{font-size:9px;letter-spacing:3px;color:var(--t3);text-transform:uppercase}

/* CAL NAV */
.cn{display:flex;align-items:center;justify-content:space-between;padding:2px 16px 6px}
.cm{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;letter-spacing:2px}
.cy{color:var(--gold);margin-left:5px}
.nb{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:transparent;
    color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px}
.nb:active{border-color:var(--gold);color:var(--gold)}

/* CAL GRID */
.cw{display:grid;grid-template-columns:repeat(7,1fr);padding:0 8px;margin-bottom:2px}
.wd{text-align:center;font-size:9px;letter-spacing:1px;color:var(--t3);text-transform:uppercase;padding:2px 0}
.cg{display:grid;grid-template-columns:repeat(7,1fr);padding:0 8px;gap:2px;flex:1;overflow-y:auto}
.cc{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    border-radius:7px;cursor:pointer;gap:2px;transition:background .15s}
.cc:active{background:var(--bg3)}
.cc.today{background:var(--gdim)}.cc.today .dn{color:var(--gold)}
.cc.sel{background:var(--gold)}.cc.sel .dn{color:var(--bg);font-weight:500}
.cc.om .dn{color:var(--t3)}
.dn{font-size:13px;line-height:1}
.dots{display:flex;gap:2px;min-height:5px}
.dot{width:4px;height:4px;border-radius:50%}
.dot.high{background:var(--red)}.dot.medium{background:var(--amb)}.dot.low{background:var(--grn)}
.cc.sel .dot{opacity:.6}

/* DAY PANEL */
#DP{background:var(--bg2);border-top:1px solid var(--border);flex-shrink:0;
    transition:height .35s cubic-bezier(.4,0,.2,1);overflow:hidden;display:flex;flex-direction:column}
#DP.col{height:56px}#DP.exp{height:52vh}
.dph{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;cursor:pointer;flex-shrink:0}
.dpt{font-family:'Cormorant Garamond',serif;font-size:16px;letter-spacing:1px}
.dpc{font-size:9px;color:var(--gold);letter-spacing:2px;background:var(--gdim);padding:2px 9px;border-radius:20px}
.dpa{display:flex;align-items:center;gap:8px}
.dpv{color:var(--t3);font-size:15px;transition:transform .3s}
#DP.exp .dpv{transform:rotate(180deg)}
#EL{flex:1;overflow-y:auto;padding:0 12px 12px}

/* ENTRY CARD */
.ec{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);
    padding:11px 13px;margin-bottom:8px;cursor:pointer;display:flex;gap:9px;
    align-items:flex-start;position:relative;overflow:hidden;transition:transform .15s}
.ec::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.ec.high::before{background:var(--red)}.ec.medium::before{background:var(--amb)}.ec.low::before{background:var(--grn)}
.ec:active{transform:translateX(3px)}
.eth{width:46px;height:46px;border-radius:7px;object-fit:cover;flex-shrink:0;border:1px solid var(--border)}
.eb{flex:1;min-width:0}
.etl{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:600;
     white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.eno{font-size:11px;color:var(--t2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.emt{display:flex;align-items:center;gap:7px;margin-top:4px}
.etm{font-size:10px;color:var(--t3);letter-spacing:1px}
.pb{font-size:9px;letter-spacing:2px;text-transform:uppercase;padding:2px 7px;border-radius:10px}
.pb.high{background:var(--rdim);color:var(--red)}.pb.medium{background:var(--adim);color:var(--amb)}.pb.low{background:var(--grdim);color:var(--grn)}
.emp{display:flex;flex-direction:column;align-items:center;padding:30px 20px;color:var(--t3)}
.ei{font-size:32px;margin-bottom:8px;opacity:.4}.et{font-size:10px;letter-spacing:2px;text-transform:uppercase}

/* FAB */
#fab{position:fixed;right:16px;bottom:18px;width:52px;height:52px;border-radius:26px;
     background:var(--gold);color:var(--bg);border:none;font-size:26px;cursor:pointer;
     box-shadow:0 4px 20px rgba(201,168,76,.45);display:none;align-items:center;
     justify-content:center;z-index:100;line-height:1}
#fab:active{transform:scale(.92)}

/* MODAL */
#MO{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;
    align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
#MO.open{display:flex}
#MD{background:var(--bg2);border:1px solid var(--border);border-radius:18px 18px 0 0;
    width:100%;max-width:600px;max-height:91vh;overflow-y:auto;padding:18px 16px 34px;
    animation:su .28s cubic-bezier(.4,0,.2,1)}
@keyframes su{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.mh{width:34px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 18px}
.mt{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;margin-bottom:16px;letter-spacing:1px}
.fl{display:block;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--t3);margin-bottom:6px}
.fi,.fta{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;
         padding:10px 12px;color:var(--text);font-family:'DM Mono',monospace;font-size:13px;
         outline:none;-webkit-appearance:none;transition:border-color .2s}
.fi:focus,.fta:focus{border-color:var(--gold)}
.fta{resize:none;height:72px;line-height:1.6}
.frow{display:flex;gap:10px}.frow .fg{flex:1}
.fg{margin-bottom:13px}
.pbs{display:flex;gap:7px}
.pb2{flex:1;padding:9px;border-radius:8px;border:1px solid var(--border);background:transparent;
     color:var(--t2);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;cursor:pointer;text-transform:uppercase}
.pb2[data-p=high].on{background:var(--rdim);border-color:var(--red);color:var(--red)}
.pb2[data-p=medium].on{background:var(--adim);border-color:var(--amb);color:var(--amb)}
.pb2[data-p=low].on{background:var(--grdim);border-color:var(--grn);color:var(--grn)}

/* IMG */
.iuz{border:1px dashed var(--border);border-radius:8px;padding:14px;text-align:center;
     cursor:pointer;position:relative;overflow:hidden}
.iuz input{position:absolute;inset:0;opacity:0;cursor:pointer}
.iut{font-size:11px;color:var(--t3)}
.ipr{width:100%;height:120px;object-fit:cover;border-radius:8px;display:none}
.iprw{position:relative}
.irm{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:11px;
     background:rgba(0,0,0,.8);border:none;color:#fff;cursor:pointer;display:none;
     align-items:center;justify-content:center;font-size:12px;z-index:1}
.iup{font-size:10px;color:var(--gold);margin-top:5px;display:none;text-align:center;letter-spacing:1px}

/* MODAL BTNS */
.ma{display:flex;gap:9px;margin-top:16px}
.bsv{flex:1;background:var(--gold);color:var(--bg);border:none;border-radius:8px;padding:12px;
     font-family:'DM Mono',monospace;font-size:12px;letter-spacing:2px;text-transform:uppercase;cursor:pointer}
.bsv:disabled{opacity:.5}
.bcl{background:transparent;border:1px solid var(--border);color:var(--t2);border-radius:8px;
     padding:12px 16px;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:2px;cursor:pointer}
.bdl{background:transparent;border:1px solid var(--red);color:var(--red);border-radius:8px;
     padding:12px 13px;font-family:'DM Mono',monospace;font-size:12px;cursor:pointer}

/* TOAST */
#toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%) translateY(18px);
       background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:11px;
       letter-spacing:1px;padding:8px 16px;border-radius:18px;opacity:0;transition:all .28s;
       z-index:400;pointer-events:none;max-width:88vw;text-align:center}
#toast.sh{opacity:1;transform:translateX(-50%) translateY(0)}

#offb{display:none;position:fixed;top:70px;left:50%;transform:translateX(-50%);
      background:var(--adim);border:1px solid var(--amb);color:var(--amb);font-size:9px;
      letter-spacing:2px;padding:3px 11px;border-radius:12px;z-index:50}
#offb.sh{display:block}
</style>
</head>
<body>

<div id="LS">
  <div class="ll">FİLİST</div>
  <div class="ls" id="lsub">yükleniyor...</div>
</div>
<div id="offb">◉ ÇEVRİMDIŞI</div>

<div id="AS">
  <div class="al">FİLİST</div>
  <div class="at">Kişisel Ajanda</div>
  <div class="ad"></div>
  <button class="bg" id="BGL" type="button">
    <svg viewBox="0 0 24 24" fill="none" width="18" height="18">
      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
    </svg>
    Google ile Giriş Yap
  </button>
  <div id="astatus"></div>
  <div id="aerr"></div>
</div>

<div id="MA">
  <header>
    <div class="an">Filist</div>
    <div style="flex:1;text-align:center">
      <div id="clk">--:--:--</div>
      <div id="cld">...</div>
    </div>
    <div class="hr"><div class="av" id="UAV">?</div></div>
  </header>
  <div id="CV">
    <div class="ts">
      <div class="tb" id="tbn">--</div>
      <div>
        <div class="tn" id="tdn">--</div>
        <div class="tm" id="tmn">-- ----</div>
      </div>
    </div>
    <div class="cn">
      <button class="nb" id="PM">‹</button>
      <div class="cm"><span id="CMN">--</span><span class="cy" id="CYR"> ----</span></div>
      <button class="nb" id="NM">›</button>
    </div>
    <div class="cw">
      <div class="wd">Pt</div><div class="wd">Sa</div><div class="wd">Ça</div>
      <div class="wd">Pe</div><div class="wd">Cu</div><div class="wd">Ct</div><div class="wd">Pz</div>
    </div>
    <div class="cg" id="CG"></div>
    <div id="DP" class="col">
      <div class="dph" id="DPH">
        <div class="dpt" id="DPT">Gün seç</div>
        <div class="dpa">
          <span class="dpc" id="DPC" style="display:none"></span>
          <span class="dpv">⌄</span>
        </div>
      </div>
      <div id="EL"></div>
    </div>
  </div>
</div>

<button id="fab" type="button">+</button>

<div id="MO">
  <div id="MD">
    <div class="mh"></div>
    <div class="mt" id="MTIT">Yeni Kayıt</div>
    <div class="fg"><label class="fl">Başlık</label><input type="text" class="fi" id="FT" placeholder="Kayıt başlığı..."></div>
    <div class="fg"><label class="fl">Not</label><textarea class="fta" id="FN" placeholder="Detaylar..."></textarea></div>
    <div class="frow">
      <div class="fg"><label class="fl">Tarih</label><input type="date" class="fi" id="FD"></div>
      <div class="fg"><label class="fl">Saat</label><input type="time" class="fi" id="FTM"></div>

          <img id="IPR" class="ipr" alt="">
          <button class="irm" id="IRM" type="button">✕</button>
        </div>
        <div class="iut" id="IUT">📷 Resim seç veya çek</div>

      </div>
    </div>

      <button class="bcl" id="BCL" type="button">İptal</button>
      <button class="bdl" id="BDL" type="button" style="display:none">Sil</button>
      <button class="bsv" id="BSV" type="button">Kaydet</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
'use strict';

// ═══ CONFIG ═══════════════════════════════════════════
const IMGBB = 'a584cfae6e7f9786deba8aac1f0afe56';
const TRM   = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const TRD   = ['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
const TRS   = ['Pt','Sa','Ça','Pe','Cu','Ct','Pz'];

// ═══ HELPERS (YUKARI TAŞINDI - HATA ÇÖZÜMÜ) ═════════════
const $=id=>document.getElementById(id);
function setLsub(t){$('lsub').textContent=t}
function fmt(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function pdate(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function pad(n){return String(n).padStart(2,'0')}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function plabel(p){return p==='high'?'Yüksek':p==='low'?'Düşük':'Orta'}
function showToast(m,d=3000){const t=$('toast');t.textContent=m;t.classList.add('sh');setTimeout(()=>t.classList.remove('sh'),d)}
function hideLS(){const e=$('LS');e.style.opacity='0';setTimeout(()=>e.style.display='none',500)}
function showAS(){$('AS').style.display='flex';$('MA').style.display='none';$('fab').style.display='none'}
function showMA(){$('AS').style.display='none';$('MA').style.display='flex';$('fab').style.display='flex'}

// ═══ FIREBASE INITIALIZE ═══════════════════════════════
let app, auth, db;
try {
  app = firebase.initializeApp({
    apiKey:"AIzaSyDgF7iMi183LI1RkHnT0ZyAJAx_8ME4oLY",
    authDomain:"filist-83f78.firebaseapp.com",
    projectId:"filist-83f78",
    storageBucket:"filist-83f78.firebasestorage.app",
    messagingSenderId:"718317516714",
    appId:"1:718317516714:web:4dc1b822230538066cddd3"
  });
  auth = firebase.auth();
  db   = firebase.firestore();
  db.settings({ experimentalForceLongPolling: true, merge: true });
} catch(e) {
  setLsub('Firebase hatası: '+e.message);
}

const provider = new firebase.auth.GoogleAuthProvider();
provider.setCustomParameters({ prompt: 'select_account' });

// ═══ STATE ════════════════════════════════════════════
let CU=null, entries={}, selDate=null, editEntry=null;
let selPri='medium', imgFile=null, exImgUrl=null;
const NOW = new Date();
let vY=NOW.getFullYear(), vM=NOW.getMonth();

// ═══ CLOCK ════════════════════════════════════════════
function tick(){
  const n=new Date();
  $('clk').textContent=[n.getHours(),n.getMinutes(),n.getSeconds()].map(pad).join(':');
  const di=(n.getDay()+6)%7;
  $('cld').textContent=TRS[di]+' '+n.getDate()+' '+TRM[n.getMonth()];
  const ti=(NOW.getDay()+6)%7;
  $('tbn').textContent=pad(NOW.getDate());
  $('tdn').textContent=TRD[ti];
  $('tmn').textContent=TRM[NOW.getMonth()]+' '+NOW.getFullYear();
}
setInterval(tick,1000); tick();
